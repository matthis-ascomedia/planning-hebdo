<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Planning hebdomadaire</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
    .card.dragging { opacity: .4; }
    .col.drag-over { background: #f1f5f9; outline: 2px dashed #cbd5e1; outline-offset: -2px; }
    input[type="checkbox"].chk {
      appearance: none; width: 16px; height: 16px; border: 1.5px solid #cbd5e1; border-radius: 5px;
      cursor: pointer; flex-shrink: 0; transition: all .15s; background: #fff; position: relative;
    }
    input[type="checkbox"].chk:hover { border-color: #64748b; }
    input[type="checkbox"].chk:checked { background: #0f172a; border-color: #0f172a; }
    input[type="checkbox"].chk:checked::after {
      content: ''; position: absolute; left: 4px; top: 1px; width: 4px; height: 8px;
      border: solid #fff; border-width: 0 1.5px 1.5px 0; transform: rotate(45deg);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen antialiased">
  <div class="max-w-[1400px] mx-auto px-5 sm:px-8 py-8">

    <header class="flex flex-wrap items-center justify-between gap-4 mb-6">
      <div>
        <h1 class="text-xl font-semibold tracking-tight">Planning hebdomadaire</h1>
        <p id="summary" class="text-sm text-slate-500 mt-0.5">&nbsp;</p>
      </div>
      <button id="new-week"
        class="text-sm font-medium px-3.5 py-2 rounded-lg border border-slate-200 bg-white hover:bg-slate-100 active:scale-[.98] transition">
        Nouvelle Semaine
      </button>
    </header>

    <form id="add-form"
      class="grid grid-cols-2 md:grid-cols-12 gap-2 bg-white border border-slate-200 rounded-xl p-2.5 mb-6 shadow-sm">
      <input name="client_name" required placeholder="Client" autocomplete="off"
        class="col-span-1 md:col-span-2 px-3 py-2 text-sm rounded-lg bg-slate-50 border border-transparent focus:bg-white focus:border-slate-300 focus:outline-none" />
      <input name="project_name" required placeholder="Projet" autocomplete="off"
        class="col-span-1 md:col-span-2 px-3 py-2 text-sm rounded-lg bg-slate-50 border border-transparent focus:bg-white focus:border-slate-300 focus:outline-none" />
      <input name="task_name" required placeholder="Nom de la tâche" autocomplete="off"
        class="col-span-2 md:col-span-3 px-3 py-2 text-sm rounded-lg bg-slate-50 border border-transparent focus:bg-white focus:border-slate-300 focus:outline-none" />
      <input name="estimated_hours" type="number" min="0" step="0.25" required placeholder="Heures"
        class="col-span-1 md:col-span-1 px-3 py-2 text-sm rounded-lg bg-slate-50 border border-transparent focus:bg-white focus:border-slate-300 focus:outline-none" />
      <select name="day_of_week"
        class="col-span-1 md:col-span-2 px-3 py-2 text-sm rounded-lg bg-slate-50 border border-transparent focus:bg-white focus:border-slate-300 focus:outline-none">
        <option>Lundi</option><option>Mardi</option><option>Mercredi</option><option>Jeudi</option><option>Vendredi</option>
      </select>
      <button type="submit"
        class="col-span-2 md:col-span-2 px-3 py-2 text-sm font-medium rounded-lg bg-slate-900 text-white hover:bg-slate-700 active:scale-[.98] transition">
        Ajouter
      </button>
    </form>

    <div id="error" class="hidden mb-4 text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg px-3 py-2"></div>

    <main id="board" class="grid grid-cols-1 md:grid-cols-5 gap-3"></main>
  </div>

  <script src="app.js"></script>
</body>
</html>
